name: Regenerate portfolio static pages
on:
  push:
    branches: [refresh-portfolio-nov-2026]
permissions:
  contents: write
jobs:
  build-pages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Commit generated site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m 'build: refresh generated portfolio pages [skip ci]'
            git push origin HEAD:refresh-portfolio-nov-2026
          fi
