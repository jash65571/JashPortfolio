name: Temporary portfolio verification and regeneration
on:
  push:
    branches: [fix-portfolio-contrast-nov-2026]
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify site
        run: |
          npm run build
          npm run check
          npm test
      - name: Install temporary browser audit dependencies
        run: |
          npm install --no-save --no-package-lock playwright axe-core
          npx playwright install --with-deps chromium
      - name: Audit all site routes at three viewport sizes
        run: node scripts/audit-ui.mjs
      - name: Commit generated HTML and sitemap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate pages with versioned CSS [skip ci]'
            git push origin HEAD:fix-portfolio-contrast-nov-2026
          fi
