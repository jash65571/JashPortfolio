name: Portfolio quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Verify generated HTML is committed
        run: git diff --exit-code -- '*.html' sitemap.xml robots.txt
      - name: Install browser audit dependencies
        run: |
          npm install --no-save --no-package-lock playwright axe-core
          npx playwright install --with-deps chromium
      - name: Audit contrast and mobile layout on every page
        run: node scripts/audit-ui.mjs
